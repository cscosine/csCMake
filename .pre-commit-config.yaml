fail_fast: false # using true is too annoying in development

repos:
  # run pre-commit autoupdate to update these versions
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files # prevents giant files from being committed.
      - id: check-case-conflict # checks for files that would conflict in case-insensitive filesystems.
      - id: check-merge-conflict # checks for files that contain merge conflict strings.
      - id: check-yaml # checks yaml files for parseable syntax.
        args: [--allow-multiple-documents]
      - id: detect-private-key # detects the presence of private keys.
      - id: end-of-file-fixer # ensures that a file is either empty, or ends with one newline.
      - id: fix-byte-order-marker # removes utf-8 byte order marker.
      - id: mixed-line-ending # replaces or checks mixed line ending.
      - id: trailing-whitespace # trims trailing whitespace.
      - id: check-executables-have-shebangs # ensures that (non-binary) executables have a shebang.
      - id: check-shebang-scripts-are-executable # ensures that (non-binary) files with a shebang are executable.
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: forbid-submodules

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        # docs/conf.py: Sphinx configuration, its libraries (docutils, sphinx, the CMake domain) are not in the hook
        # environment and ship no stubs; ruff checks it
        exclude: ^docs/
        args:
          [
            "--config-file=pyproject.toml",
          ]

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      # config: .cmake-format.json (line width 120, lint naming/disabled codes)
      # templates (*.cmake.in) are handled by the local cmake-*-templates hooks below
      - id: cmake-format
      - id: cmake-lint

  - repo: local
    hooks:
      # regenerates presets/csv1 in place; fails (files modified) when the committed
      # presets were out of date, then `git add presets/csv1` and commit again.
      # requires the dev venv (./setup.sh, source .venv/bin/activate): it runs the installed
      # cscmake-generate-presets command. A local hook cannot install this repo itself
      # (additional_dependencies: [".[dev]"] installs pre-commit's placeholder package).
      - id: generate-csv1-presets
        name: Generate csv1 presets
        entry: cscmake-generate-presets --quiet
        language: system
        pass_filenames: false
        always_run: true

      # configure_file templates: @VAR@ placeholders are swapped for valid CMake stand-ins, then
      # cmake-format / cmake-lint run and the placeholders are restored (cscmake.devtools.cmake_template).
      # require the dev venv, like generate-csv1-presets
      - id: cmake-format-templates
        name: cmake-format (templates)
        entry: cscmake-cmake-template format
        language: system
        files: \.cmake\.in$

      - id: cmake-lint-templates
        name: cmake-lint (templates)
        entry: cscmake-cmake-template lint
        language: system
        files: \.cmake\.in$

      # reference documentation complete: every public command, variable and property of the CMake modules has its
      # #.rst: entry (cscmake.devtools.check_docs); requires the dev venv, like generate-csv1-presets
      - id: check-docs
        name: Check the reference documentation
        entry: cscmake-check-docs
        language: system
        pass_filenames: false
        files: ^(csCMake\.cmake|utils/.*\.cmake|docs/reference/.*)$

      # requires the dev venv, like generate-csv1-presets
      - id: import-linter
        name: Import Linter
        entry: lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: no-unstaged-changes
        name: Fail if unstaged changes exist
        entry: git diff --quiet
        language: system
        pass_filenames: false
