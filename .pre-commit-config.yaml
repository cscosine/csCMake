# Owned by the project template (cs-project-template): change it there.
# Project hooks: between the `project: begin` / `project: end` markers (they merge cleanly on `copier update`).
fail_fast: false # using true is too annoying in development

repos:
  # run pre-commit autoupdate to update these versions
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files # prevents giant files from being committed.
        # --- project: begin (files allowed to be large on purpose, e.g. datasets) ---
        # exclude: ^datasets/
        # --- project: end ---
      - id: check-case-conflict # checks for files that would conflict in case-insensitive filesystems.
      - id: check-merge-conflict # checks for files that contain merge conflict strings.
      - id: check-yaml # checks yaml files for parseable syntax.
        args: [--allow-multiple-documents]
      - id: detect-private-key # detects the presence of private keys.
      - id: end-of-file-fixer # ensures that a file is either empty, or ends with one newline.
      - id: fix-byte-order-marker # removes utf-8 byte order marker.
      - id: mixed-line-ending # replaces or checks mixed line ending.
      - id: trailing-whitespace # trims trailing whitespace.
      - id: check-executables-have-shebangs # ensures that (non-binary) executables have a shebang.
      - id: check-shebang-scripts-are-executable # ensures that (non-binary) files with a shebang are executable.
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: forbid-submodules

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy runs in the project venv (./setup.sh, then activate it): it sees the project's dependencies, csorchestrator
  # included (not on PyPI); skipped when the repository has no Python files
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        args:
          - --config-file=pyproject.toml

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.4
    hooks:
      - id: clang-format
        # C, C++, CUDA, Objective-C sources only: not JSON or JavaScript (clang-format's other languages), which would
        # touch generated files such as CMakePresets.json
        types_or: [c, c++, cuda, objective-c]
        exclude: '\.m$'
        args: ["-style=file"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # --- project: begin (this repository's own hooks, between the two markers) ---
  - repo: local
    hooks:
      # regenerates presets/csv1 in place; fails (files modified) when the committed
      # presets were out of date, then `git add presets/csv1` and commit again.
      # requires the dev venv (./setup.sh, source .venv/bin/activate): it runs the installed
      # cscmake-generate-presets command. A local hook cannot install this repo itself
      # (additional_dependencies: [".[dev]"] installs pre-commit's placeholder package).
      - id: generate-csv1-presets
        name: Generate csv1 presets
        entry: cscmake-generate-presets --quiet
        language: system
        pass_filenames: false
        always_run: true

      # CMake files, templates (@VAR@) included: gersemi formats (.gersemirc, the cs_* signatures in
      # gersemi/cscmake.py), cscmake-lint checks the rules of csCMake (cscmake.devtools.cmake_lint); require the dev
      # venv, like generate-csv1-presets
      - id: gersemi
        name: gersemi (format CMake)
        entry: gersemi -i
        language: system
        files: (\.cmake|\.cmake\.in|CMakeLists\.txt)$

      - id: cscmake-lint
        name: cscmake-lint (lint CMake)
        entry: cscmake-lint
        language: system
        files: (\.cmake|\.cmake\.in|CMakeLists\.txt)$

      # reference documentation complete: every public command, variable and property of the CMake modules has its
      # #.rst: entry (cscmake.devtools.check_docs); requires the dev venv, like generate-csv1-presets
      - id: check-docs
        name: Check the reference documentation
        entry: cscmake-check-docs
        language: system
        pass_filenames: false
        files: ^(csCMake\.cmake|csCMakeSetup\.cmake|modules/.*\.cmake|docs/reference/.*)$

      # requires the dev venv, like generate-csv1-presets
      - id: import-linter
        name: Import Linter
        entry: lint-imports
        language: system
        pass_filenames: false
        always_run: true
  # --- project: end ---

  # the final check, always last (template)
  - repo: local
    hooks:
      - id: no-unstaged-changes
        name: Fail if unstaged changes exist
        entry: git diff --quiet
        language: system
        pass_filenames: false
