name: Docs

# Build the documentation (Sphinx, reference from the #.rst: blocks of the CMake modules) on every push, pull
# request and release tag (called by release.yml), as a downloadable artifact; publish it on GitHub Pages from main.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, dev ]
  # release tags: called by release.yml
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # -W -n: every warning is an error, every reference must resolve
      - name: Build the documentation
        run: sphinx-build -W -n --keep-going docs docs/_build/html

      - name: Upload the documentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
