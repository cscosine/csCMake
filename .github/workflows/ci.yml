name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, dev ]
  # release tags: called by release.yml
  workflow_call:

jobs:
  checks:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # every runner image of the smoke workflow (its compilers and CMake) on one Python version; the other Python
        # versions on one image; the minimum dependencies on the oldest image and Python version
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, macos-15, macos-26, windows-2022, windows-2025-vs2026]
        python-version: ["3.14"]
        deps: ["latest"]
        include:
          - { os: ubuntu-24.04, python-version: "3.11", deps: "latest" }
          - { os: ubuntu-24.04, python-version: "3.12", deps: "latest" }
          - { os: ubuntu-24.04, python-version: "3.13", deps: "latest" }
          - { os: ubuntu-24.04, python-version: "3.15", deps: "latest" }
          - { os: ubuntu-22.04, python-version: "3.11", deps: "minimum" }

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            setup.cfg
            requirements*.txt
            constraints-minimum.txt

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install dependencies
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "minimum" ]; then
            pip install -e .[dev] -c constraints-minimum.txt
          else
            pip install -e .[dev]
          fi
        shell: bash

      # Windows: the same commands in pwsh, not bash. pip may build a Rust extension from source (gersemi has no wheel
      # for every Python version), linked with the MSVC linker of the environment set up above; Git Bash puts Git's
      # usr/bin first on PATH, and its own link.exe is then found instead of the MSVC one.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("${{ matrix.deps }}" -eq "minimum") {
            python -m pip install -e ".[dev]" -c constraints-minimum.txt
          } else {
            python -m pip install -e ".[dev]"
          }
        shell: pwsh

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run tests with coverage
        env:
          ACTIONS_ORG_ACCESS: ${{ secrets.ACTIONS_ORG_ACCESS }}
        run: |
          pytest \
            --log-cli-level=INFO \
            --cov=cscmake \
            --cov-branch \
            --cov-report=xml:coverage-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}.xml \
            --cov-report=html:htmlcov-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }} \
            --cov-report=term-missing \
            | tee coverage-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}.txt
        shell: bash

      - name: Upload coverage HTML as artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.deps }}
          path: htmlcov-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}

      - name: Add coverage to summary
        run: |
          {
            echo "## 🧪 Coverage (${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.deps }})"
            echo ""
            echo '```'
            cat "coverage-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
