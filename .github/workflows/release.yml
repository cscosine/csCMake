name: release

# a release tag v<major>.<minor>.<patch>[-<pre-release>]: ci, smoke and docs on the tag, then the GitHub Release with
# the csCMake package, the documentation and the checksums (docs/contributing/releasing.md)

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  smoke:
    uses: ./.github/workflows/smoke.yml

  docs:
    uses: ./.github/workflows/docs.yml
    # its deploy job (pushes to main only) declares these
    permissions:
      contents: read
      pages: write
      id-token: write

  publish:
    needs: [ ci, smoke, docs ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Build the documentation
        run: sphinx-build -W -n --keep-going docs docs/_build/html

      - name: Build the release assets
        run: cscmake-release --tag "${GITHUB_REF_NAME}" --docs docs/_build/html --output dist

      # a tag with a pre-release part (v1.2.3-rc1) makes a GitHub pre-release
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease=(--prerelease); fi
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" "${prerelease[@]}" \
            --title "csCMake ${version}" \
            --notes-file dist/release-notes.md \
            "dist/csCMake-${version}.tar.gz" \
            "dist/csCMake-${version}.zip" \
            "dist/csCMake-docs-${version}.zip" \
            dist/SHA256SUMS
