[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cscmake"
version = "0.4.0"
description = "cscmake facilities for C++ projects config, build, deployment"
authors = [
  { name = "cscosine-dev", email = "cscosine@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# runtime: standard library only
dependencies = []

[project.scripts]
cscmake-generate-presets = "cscmake.presets.generate:main"
cscmake-lint = "cscmake.devtools.cmake_lint:main"
cscmake-update-cmake-inventory = "cscmake.devtools.cmake_inventory:main"
cscmake-check-docs = "cscmake.devtools.check_docs:main"
cscmake-release = "cscmake.devtools.release:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# development tools (tests, linting, type checking)
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "mypy>=1.0",
    "ruff>=0.4",
    "pre-commit>=4",
    "import-linter[ui]>=2.11",
    "gersemi>=0.29.2",
    # documentation (Sphinx, CMake domain, Markdown pages)
    "sphinx>=8.1",
    "sphinxcontrib-moderncmakedomain>=3.29",
    "myst-parser>=4.0",
    "sphinxcontrib-mermaid>=1.0",
    "furo>=2024.8.6",
    "sphinx-design>=0.6.1",
]

# ===============================
# Ruff - Linter + Formatter
# ===============================
[tool.ruff]

# Maximum allowed line length for linting.
line-length = 120

# Target Python version for rule selection / parsing.
target-version = "py311"

[tool.ruff.lint]
# Enabled rule groups:
# E  -> Pycodestyle errors (style issues)
# F  -> Pyflakes (logical errors / unused imports)
# I  -> Import sorting
# B  -> Bugbear (common bug patterns)
# UP -> modern Python suggestions
# SIM -> catches simplifications
# N  -> PEP8 naming conventions
# C4 -> flake8-comprehensions (more Pythonic comprehensions)
# W  -> Pycodestyle warnings
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "W"]

[tool.ruff.format]
# Force double quotes in formatted code.
# This keeps formatting consistent across the project.
quote-style = "double"

# ===============================
# MyPy - Static Type Checker
# ===============================
[tool.mypy]
mypy_path = "src"

# Python version used for type checking.
python_version = "3.11"

# Enables strict type checking mode.
# This makes mypy behave like a production-grade type checker.
# It enables:
# - No implicit Any
# - Strict optional checks
# - Unused ignore detection
strict = true

# Ignore missing type hints in third-party libraries.
# Many libraries don't ship with typing, so this avoids noise.
ignore_missing_imports = true

# Treat src/ as a real package root. Do not auto-guess.
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false

# ===============================
# pytest - test execution
# ===============================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: long tests (CMake smoke builds), skipped unless --run-all is given",
    "requires(*tools): skipped when one of the executables is not on PATH",
]

# ===============================
# coverage
# ===============================

[tool.coverage.run]
branch = true
source = ["cscmake"]

[tool.coverage.report]
show_missing = true
fail_under = 100
# unreachable by design: the script entry points, and the exhaustiveness checks of the match statements
exclude_also = [
    "if __name__ == .__main__.:",
    "case _:\\n\\s*assert_never\\(",
]

# ===============================
# import linter
# ===============================

[tool.importlinter]
root_package = "cscmake"

[[tool.importlinter.contracts]]
name = "high level layers"
type = "layers"
layers = ["presets | devtools"]
containers = ["cscmake"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "presets layers"
type = "layers"
layers = ["generate", "registry | render"]
containers = ["cscmake.presets"]
exhaustive = true
