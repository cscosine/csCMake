# Mixed file. Owned by the project: [project] and its sub-tables, [tool.setuptools], and every table after the
# "project" marker at the end. Owned by the project template (cs-project-template, change it there): [build-system]
# and the tables between the "template" markers. Never edit a template line here: `copier update` keeps the project
# lines and replaces the template ones.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cscmake"
version = "1.0.0"
description = "cscmake facilities for C++ projects config, build, deployment"
authors = [
  { name = "cscosine-dev", email = "cscosine@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# runtime: standard library only
dependencies = []

[project.scripts]
cscmake-generate-presets = "cscmake.presets.generate:main"
cscmake-lint = "cscmake.devtools.cmake_lint:main"
cscmake-update-cmake-inventory = "cscmake.devtools.cmake_inventory:main"
cscmake-check-docs = "cscmake.devtools.check_docs:main"
cscmake-release = "cscmake.devtools.release:main"

[project.optional-dependencies]
dev = [
    # template: the tools of .pre-commit-config.yaml and the tests
    "pytest>=9",
    "pytest-cov>=7",
    "mypy>=1.20",
    "ruff>=0.4",
    "pre-commit>=4",
    "import-linter[ui]>=2.11",
    "types-PyYAML",
    # project: below
    "gersemi>=0.29.2",
    # documentation (Sphinx, CMake domain, Markdown pages)
    "sphinx>=8.1",
    "sphinxcontrib-moderncmakedomain>=3.29",
    "myst-parser>=4.0",
    "sphinxcontrib-mermaid>=1.0",
    "furo>=2024.8.6",
    "sphinx-design>=0.6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

# === template: begin =================================================================================================

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E, W: pycodestyle; F: pyflakes; I: import sorting; B: bugbear; UP: pyupgrade; SIM: simplifications;
# N: PEP 8 naming; C4: comprehensions
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
mypy_path = "src"

# csorchestrator workspace
exclude = "^workspace/"
python_version = "3.11"
# strict: no implicit Any, strict optional, unused ignores reported
strict = true
# third-party libraries without type hints
ignore_missing_imports = true
# src/ is the package root: no guessing
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
# markers and the --run-* options: conftest.py
testpaths = ["tests"]
norecursedirs = ["workspace", "*.egg-info", ".git", "__pycache__"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]

# === template: end ===================================================================================================

# --- project ---

# ===============================
# coverage
# ===============================

[tool.coverage.run]
branch = true
source = ["cscmake"]

[tool.coverage.report]
show_missing = true
fail_under = 100
# unreachable by design: the script entry points, and the exhaustiveness checks of the match statements
exclude_also = [
    "if __name__ == .__main__.:",
    "case _:\\n\\s*assert_never\\(",
]

# ===============================
# import linter
# ===============================

[tool.importlinter]
root_package = "cscmake"

[[tool.importlinter.contracts]]
name = "high level layers"
type = "layers"
layers = ["presets | devtools"]
containers = ["cscmake"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "presets layers"
type = "layers"
layers = ["generate", "registry | render"]
containers = ["cscmake.presets"]
exhaustive = true
